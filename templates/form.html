<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Invoice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .card { border-radius: 1rem; }
    @media (max-width: 768px) {
      h3 { font-size: 1.4rem; }
      label { font-size: 0.9rem; }
      .btn { font-size: 0.9rem; }
    }
  </style>
</head>
<body>

<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-header text-center bg-dark text-white">
      <h3>Generate Invoice</h3>
    </div>
    <div class="card-body">
      <form method="POST">
        
        <!-- Invoice Details -->
        <div class="row mb-3">
          <div class="col-md-6 mb-2">
            <label>Invoice Number</label>
            <input type="text" class="form-control" name="invoice_number" placeholder="INV001" required>
          </div>
          <div class="col-md-6 mb-2">
            <label>Billing Date</label>
            <input type="date" class="form-control" name="billing_date">
          </div>
        </div>

        <!-- Client Info -->
        <div class="row mb-3">
          <div class="col-md-6 mb-2">
            <label>Client Name</label>
            <input type="text" class="form-control" name="client_name" placeholder="Enter client name" required>
          </div>
          <div class="col-md-6 mb-2">
            <label>Client Address</label>
            <input type="text" class="form-control" name="client_address" placeholder="Enter client address" required>
          </div>
          <div class="col-md-6 mb-2">
            <label>Client GST</label>
            <input type="text" class="form-control" name="client_gst" placeholder="Enter client address" required>
          </div>
        </div>

        <!-- Payment Mode -->
        <div class="mb-3">
          <label>Payment Mode</label>
          <select class="form-select" name="payment_mode">
            <option>Cash</option>
            <option>UPI</option>
            <option>Bank Transfer</option>
          </select>
        </div>

        <hr>

        <!-- Product Section -->
        <h5 class="text-center mb-3">Products</h5>
        <div id="product-list"></div>

        <div class="text-center">
          <button type="button" class="btn btn-outline-primary btn-sm mb-3" onclick="addProduct()">+ Add Product</button>
        </div>

        <!-- Submit -->
        <div class="text-center">
          <button type="submit" class="btn btn-dark px-4">Generate Invoice</button>
        </div>

      </form>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
 const products = JSON.parse(`{{ products | tojson | safe }}`);

  function addProduct() {
    const container = document.getElementById('product-list');
    const div = document.createElement('div');
    div.className = 'row g-2 mb-3 align-items-end product-item';

    div.innerHTML = `
      <div class="col-md-4">
        <label>Product</label>
        <select name="product_name" class="form-select" onchange="fillDetails(this)" required>
          <option value="">Select</option>
          ${products.map(p => 
            `<option value="${p.name}" data-mrp="${p.mrp}" data-hsn="${p.hsn}" data-gst="${p.gst}">
              ${p.name}
            </option>`).join('')}
        </select>
      </div>

      <div class="col-6 col-md-2">
        <label>Qty</label>
        <input type="number" name="qty" class="form-control" value="1" min="1" required>
      </div>

      <div class="col-6 col-md-2">
        <label>Rate</label>
        <input type="number" name="rate" class="form-control" step="0.01" required>
      </div>

      <!-- Hidden fields -->
      <input type="hidden" name="mrp">
      <input type="hidden" name="hsn">
      <input type="hidden" name="gst">

      <div class="col-12 col-md-2 text-end">
        <button type="button" class="btn btn-outline-danger btn-sm" onclick="this.closest('.product-item').remove()">Remove</button>
      </div>
    `;
    container.appendChild(div);
  }

  function fillDetails(select) {
    const selected = select.options[select.selectedIndex];
    const parent = select.closest('.product-item');
    parent.querySelector('[name="mrp"]').value = selected.dataset.mrp;
    parent.querySelector('[name="hsn"]').value = selected.dataset.hsn;
    parent.querySelector('[name="gst"]').value = selected.dataset.gst;
  }

  window.onload = addProduct; // Add one product by default
</script>
</body>
</html>
